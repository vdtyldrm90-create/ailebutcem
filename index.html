<style>

.bottom{display:none}.empty{text-align:center;padding:22px;color:var(--muted);font-size:12px}

.chart{height:210px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--border);padding:10px 4px 0}.monthbar{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;position:relative}.bar{width:38%;min-height:2px;border-radius:4px 4px 0 0}.bar.in{background:#75c697}.bar.out{background:#e78a82}.monthlabel{position:absolute;bottom:-17px;font-size:9px;color:var(--muted)}

@media(max-width:800px){.cloud-grid{grid-template-columns:1fr}.cloud-invite-grid{grid-template-columns:1fr;justify-items:center}.cloud-invite-info{text-align:center}.cloud-qr{width:190px;height:190px}}

/* MOBIL GELISTIRMELERI */
@media (max-width:800px){
  html{font-size:16px;-webkit-text-size-adjust:100%}
  body{overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
  .app{width:100%;overflow:hidden}
  header{position:sticky;top:0}
  .head{min-height:58px;padding:9px 12px}
  .logo{width:34px;height:34px;border-radius:10px}
  .brand b{font-size:15px}
  .profile{height:38px;max-width:125px;padding:7px 9px;border-radius:10px}
  main{width:100%;padding:14px 10px calc(88px + env(safe-area-inset-bottom));}
  .stack{gap:12px}
  .title h1{font-size:21px;line-height:1.2}
  .title p{font-size:12px;line-height:1.4}
  .grid3{grid-template-columns:1fr 1fr;gap:8px}
  .grid3 .stat:last-child{grid-column:1/-1}
  .stat{padding:12px;border-radius:14px}
  .stat small{font-size:10px}
  .stat .value{font-size:18px;margin-top:5px}
  .panel{padding:13px;border-radius:15px;min-width:0}
  .panelhead{margin-bottom:10px;align-items:center}
  .panelhead h2{font-size:14px}
  .panelhead p{font-size:10px;line-height:1.35}
  .grid2,.split{grid-template-columns:1fr;gap:10px}
  .row2{grid-template-columns:1fr 1fr;gap:8px}
  .field input,.field select{min-height:42px;padding:9px;font-size:14px}
  .field label{font-size:10px}
  .primary,.outline{min-height:40px;padding:9px 11px}
  .segment{max-width:100%;overflow:auto;flex-shrink:0}
  .segment button{min-height:34px;padding:6px 9px;white-space:nowrap}
  .item{gap:8px;padding:10px 0}
  .item .icon{width:32px;height:32px}
  .itemmain b{font-size:12px}
  .sub{font-size:9px;line-height:1.35}
  .amount{font-size:11px}
  .mobilelist .item{padding:11px 0}
  .mobilelist .ghost{padding:6px 4px}
  .goalgrid{grid-template-columns:1fr;gap:10px}
  .goal{padding:13px}
  .goaladd{display:grid;grid-template-columns:78px 1fr 38px 38px;gap:5px}
  .goaladd select,.goaladd input{width:100%;min-width:0;height:39px}
  .goaladd button{height:39px;padding:0}
  .rategrid{grid-template-columns:repeat(3,1fr);gap:6px}
  .rate{padding:9px 7px;text-align:center}
  .rate small{font-size:8px}.rate b{font-size:12px}
  .family{grid-template-columns:1fr;gap:7px}
  .member{padding:10px}
  .alert{padding:12px;border-radius:14px}
  .chart{height:180px;gap:4px}
  .bottom{left:7px;right:7px;bottom:7px;padding:4px;border-radius:16px;grid-template-columns:repeat(5,1fr);padding-bottom:max(4px,env(safe-area-inset-bottom))}
  .bottom button{font-size:8px;min-width:0;padding:5px 1px}
  .bottom .ni{font-size:15px;line-height:15px}
  .modal{align-items:flex-end;justify-content:center;padding:0}
  .modalbox{width:100%;max-height:92vh;border-radius:20px 20px 0 0;padding:15px 13px calc(18px + env(safe-area-inset-bottom))}
  .modalbox .row2{grid-template-columns:1fr}
}
@media (max-width:430px){
  .head{gap:7px}.brand{gap:7px}.profile{max-width:105px;font-size:12px}
  .grid3 .stat .value{font-size:16px}
  .row2{grid-template-columns:1fr}
  .rategrid{grid-template-columns:1fr 1fr 1fr}
  .goaladd{grid-template-columns:70px 1fr 36px 36px}
  .goaladd select,.goaladd input,.goaladd button{font-size:12px}
  .panelhead{gap:7px}
  .panelhead .ghost{padding:5px}
}
@media (max-width:360px){
  main{padding-left:8px;padding-right:8px}
  .grid3{gap:6px}.stat{padding:10px}.stat .value{font-size:15px}
  .bottom button{font-size:7px}.bottom .ni{font-size:14px}
  .profile{max-width:94px}
}

/* MOBİL ALT MENÜ */
@media (max-width: 800px) {
  body {
    padding-bottom: 82px !important;
  }

  /* Olası üst navigasyon/sticky davranışlarını kapat */
  .tabs, .nav-tabs, .navigation, nav.tabs {
    position: fixed !important;
    top: auto !important;
    bottom: 0 !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    margin: 0 !important;
    z-index: 9999 !important;
    border-radius: 18px 18px 0 0 !important;
    padding: 7px max(7px, env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom)) max(7px, env(safe-area-inset-right)) !important;
    background: rgba(255,255,255,.97) !important;
    box-shadow: 0 -5px 25px rgba(15,23,42,.12) !important;
    backdrop-filter: blur(14px) !important;
    -webkit-backdrop-filter: blur(14px) !important;
  }

  .tabs button, .nav-tabs button, .navigation button, nav.tabs button {
    min-height: 48px !important;
    padding: 6px 3px !important;
    border-radius: 12px !important;
    font-size: 10px !important;
    flex: 1 1 0 !important;
  }

  /* İçerik alt menünün altında kalmasın */
  main, .app, .container, .content {
    padding-bottom: 12px !important;
  }
}

@media (max-width: 420px) {
  body {
    padding-bottom: 76px !important;
  }

  .tabs button, .nav-tabs button, .navigation button, nav.tabs button {
    font-size: 9px !important;
    min-height: 45px !important;
  }
}


.tx-type-row,
.tx-type-toggle,
.type-toggle,
.income-expense-toggle{
  font-size:16px !important;
  font-weight:800 !important;
}
.tx-type-row label,
.tx-type-toggle label,
.type-toggle label,
.income-expense-toggle label{
  font-size:16px !important;
  font-weight:800 !important;
}



.home-summary-wrap{width:100%}
.home-summary-filter{display:flex;justify-content:flex-start;align-items:center;margin:0 0 5px 2px}
.home-summary-filter .date-filter{margin:0;display:inline-flex;gap:4px;transform:scale(.86);transform-origin:left center}
.home-summary-filter .date-filter button{min-height:28px;padding:5px 8px;font-size:11px;font-weight:700}
@media(max-width:480px){
 .home-summary-filter{margin-left:1px;margin-bottom:4px}
 .home-summary-filter .date-filter{transform:scale(.82)}
 .home-summary-filter .date-filter button{min-height:26px;padding:4px 7px;font-size:10px}
}



.family-name-form{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}

.family-name-form button{min-height:42px}

.family-qr-box img{width:100%;height:100%;object-fit:contain;display:block}

function durationParts(start,end){
  if(!start||!end)return null;
  let a=new Date(start+'T12:00:00'),b=new Date(end+'T12:00:00');
  if(Number.isNaN(a.getTime())||Number.isNaN(b.getTime()))return null;

  if(c>b){years--;c=new Date(a);c.setFullYear(c.getFullYear()+years)}

function parseMoney(v){
  if(v==null)return 0;
  let x=String(v).trim().replace(/\s/g,'');
  if(!x)return 0;
  if(x.includes('.') && x.includes(',')){
    if(x.lastIndexOf(',')>x.lastIndexOf('.')) x=x.replace(/\./g,'').replace(',','.');
    else x=x.replace(/,/g,'');
  }else if(x.includes(',')){
    const parts=x.split(',');
    if(parts.length===2 && parts[1].length<=2) x=parts[0].replace(/\./g,'')+'.'+parts[1];
    else x=x.replace(/,/g,'');
  }else if(x.includes('.')){
    const parts=x.split('.');
    if(parts.length===2 && parts[1].length<=2) x=parts[0].replace(/,/g,'')+'.'+parts[1];
    else x=x.replace(/\./g,'');
  }
  const n=Number(x.replace(/[^0-9.-]/g,''));
  return Number.isFinite(n)?n:0;
}

// Use FIFO to reduce older purchased lots when an asset is withdrawn.
// Old movements without an entered purchase price still reduce quantity,
// but are excluded from profit/loss because their actual cost is unknown.
function acquisitionLotState(){
  const timeline=(S.savingMovements||[]).map((m,index)=>({...m,__index:index}));
  timeline.sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.createdAt||'').localeCompare(String(b.createdAt||''))||(b.__index-a.__index));
  const lotsByKey=new Map(),byMovementId=new Map(),withdrawalsByMovementId=new Map();
  for(const m of timeline){
    const asset=m.asset||'TRY',key=String(m.goalId)+'::'+asset,qty=Math.max(0,Number(m.quantity)||0);
    if(Number(m.sign)>0){
      const lot={id:m.id,goalId:m.goalId,asset,remaining:qty,costRate:movementCostRate(m),movement:m};
      if(!lotsByKey.has(key))lotsByKey.set(key,[]);
      lotsByKey.get(key).push(lot);
      byMovementId.set(String(m.id),lot);
    }else if(Number(m.sign)<0){
      let toRemove=qty,allocatedQty=0,knownQty=0,unknownQty=0,cost=0;
      for(const lot of (lotsByKey.get(key)||[])){
        if(toRemove<=0)break;
        const used=Math.min(lot.remaining,toRemove);
        if(used<=0)continue;
        allocatedQty+=used;
        if(Number(lot.costRate)>0){knownQty+=used;cost+=used*Number(lot.costRate)}
        else unknownQty+=used;
        lot.remaining=Math.max(0,lot.remaining-used);toRemove-=used;
      }
      // A withdrawal not matched to recorded lots has an unknown cost basis.
      if(toRemove>0)unknownQty+=toRemove;
      // TL has no exchange-rate gain/loss; its nominal cost equals its amount.
      if(asset==='TRY'){
        cost=qty;allocatedQty=qty;knownQty=qty;unknownQty=0;
      }
      withdrawalsByMovementId.set(String(m.id),{quantity:qty,allocatedQty,knownQty,unknownQty,cost});
    }
  }
  return {lotsByKey,byMovementId,withdrawalsByMovementId};
}
function trackedProfitLoss(lotState=acquisitionLotState()){
  let cost=0,value=0,repurchase=0,quantity=0;
  const completedGoalIds=new Set((S.goals||[]).filter(goalIsCompleted).map(g=>String(g.id)));
  for(const lots of lotState.lotsByKey.values())for(const lot of lots){
    if(completedGoalIds.has(String(lot.goalId))||lot.remaining<=0||!(lot.costRate>0)||lot.asset==='TRY')continue;
    quantity+=lot.remaining;cost+=lot.remaining*lot.costRate;
    value+=lot.remaining*currentExitRate(lot.asset);
    repurchase+=lot.remaining*currentPurchaseRate(lot.asset);
  }
  const profit=value-cost;
  return {cost,value,repurchase,profit,percent:cost>0?profit/cost*100:0,quantity};
}

function reportSetMode(mode){reportMode=mode==='yearly'?'yearly':'monthly';render()}
function reportSetYear(year){const n=Number(year);if(Number.isFinite(n))reportYear=n;render()}
function reportSetMonth(month){const n=Number(month);if(Number.isInteger(n)&&n>=0&&n<=11)reportMonth=n;render()}
function reportIso(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function reportMonthName(y,m,long=true){return new Date(y,m,1).toLocaleDateString('tr-TR',{month:long?'long':'short'})}
function reportYears(){
  const set=new Set([new Date().getFullYear(),Number(reportYear)]);
  const addIso=iso=>{if(/^\d{4}-\d{2}-\d{2}$/.test(String(iso||'')))set.add(Number(String(iso).slice(0,4)))};
  (S.transactions||[]).forEach(t=>addIso(t.date));
  (S.payments||[]).forEach(p=>{
    addIso(p.dueDate);
    if(p.recurring&&!p.recurringGroupId&&!p.installment&&p.dueDate){
      const months=Math.min(600,Math.max(1,Number(p.remaining??p.months)||1));
      let cursor=p.dueDate,anchor=Number(String(p.dueDate).slice(-2))||1;
      for(let i=1;i<months;i++)cursor=monthlyNextDate(cursor,anchor);
      addIso(cursor);
    }
  });
  (S.recurringTransactions||[]).forEach(r=>{addIso(r.startDate);addIso(r.nextDate);});
  let years=[...set].filter(Number.isFinite).sort((a,b)=>b-a);
  if(years.length>20)years=years.slice(0,20);
  return years;
}
function reportPaymentOccurrences(p){
  if(p.status!=='bekliyor'||!p.dueDate)return [];
  const isInstallment=!!(p.recurringGroupId||p.installment);
  const count=!isInstallment&&p.recurring?Math.min(600,Math.max(1,Math.floor(Number(p.remaining??p.months)||1))):1;
  const anchor=Number(String(p.dueDate).slice(-2))||1;
  const out=[];let cursor=p.dueDate;
  for(let i=0;i<count;i++){
    out.push({date:cursor,amount:Number(p.amount)||0,asset:p.asset||'TRY',category:p.category||'Diğer',title:p.title||'Planlı ödeme',paymentId:p.id,occurrence:i+1});
    if(!isInstallment&&p.recurring&&i<count-1)cursor=monthlyNextDate(cursor,anchor);
  }
  return out;
}
function reportPeriod(start,end){
  const today=date();
  const result={actualIncome:0,actualExpense:0,plannedIncome:0,plannedExpense:0,transactions:0,plannedPayments:0,incomeCategories:{},expenseCategories:{}};
  const inPeriod=iso=>{const day=String(iso||'').slice(0,10);return !!day&&day>=start&&day<=end;};
  const addCategory=(bucketName,name,kind,amount)=>{
    const key=(name||'Diğer').trim()||'Diğer';
    const bucket=result[bucketName];
    const row=bucket[key]||(bucket[key]={category:key,actual:0,planned:0});
    row[kind]+=amount;
  };
  (S.transactions||[]).forEach(t=>{
    if(!inPeriod(t.date))return;
    const amount=(Number(t.amount)||0)*(rates[t.asset||'TRY']||1);
    const future=String(t.date||'').slice(0,10)>today;
    const isIncome=t.type==='gelir'||t.type==='income';
    if(isIncome){
      result[future?'plannedIncome':'actualIncome']+=amount;
      addCategory('incomeCategories',t.category,future?'planned':'actual',amount);
    }else{
      result[future?'plannedExpense':'actualExpense']+=amount;
      addCategory('expenseCategories',t.category,future?'planned':'actual',amount);
    }
    result.transactions++;
  });
  (S.payments||[]).forEach(p=>{
    reportPaymentOccurrences(p).forEach(occ=>{
      if(!inPeriod(occ.date))return;
      const amount=occ.amount*(rates[occ.asset||'TRY']||1);
      result.plannedExpense+=amount;
      result.plannedPayments++;
      addCategory('expenseCategories',occ.category,'planned',amount);
    });
  });
  for(const key of ['incomeCategories','expenseCategories']){
    result[key]=Object.values(result[key]).map(x=>({...x,total:x.actual+x.planned})).sort((a,b)=>b.total-a.total);
  }
  result.actualNet=result.actualIncome-result.actualExpense;
  result.plannedNet=result.plannedIncome-result.plannedExpense;
  result.totalIncome=result.actualIncome+result.plannedIncome;
  result.totalExpense=result.actualExpense+result.plannedExpense;
  return result;
}
function reportAggregate(rows){
  const keys=['actualIncome','actualExpense','plannedIncome','plannedExpense','transactions','plannedPayments'];
  const out=Object.fromEntries(keys.map(k=>[k,0]));
  rows.forEach(r=>keys.forEach(k=>out[k]+=(Number(r[k])||0)));
  const aggregateCategories=key=>{
    const map={};
    rows.forEach(r=>(r[key]||[]).forEach(c=>{
      const item=map[c.category]||(map[c.category]={category:c.category,actual:0,planned:0});
      item.actual+=Number(c.actual)||0;item.planned+=Number(c.planned)||0;
    }));
    return Object.values(map).map(x=>({...x,total:x.actual+x.planned})).sort((a,b)=>b.total-a.total);
  };
  out.incomeCategories=aggregateCategories('incomeCategories');
  out.expenseCategories=aggregateCategories('expenseCategories');
  out.actualNet=out.actualIncome-out.actualExpense;
  out.plannedNet=out.plannedIncome-out.plannedExpense;
  out.totalIncome=out.actualIncome+out.plannedIncome;
  out.totalExpense=out.actualExpense+out.plannedExpense;
  return out;
}

function reportSavingsSection(start,end,periodLabel){
  const inPeriod=m=>{const d=String(m.date||'').slice(0,10);return !!d&&d>=start&&d<=end;};
  const movements=(S.savingMovements||[]).filter(inPeriod);
  let periodCost=0,estimatedCostCount=0,depositCount=0,withdrawalValue=0,withdrawalCount=0;
  const perGoal=new Map();
  for(const m of movements){
    const goalId=String(m.goalId||'none');
    const row=perGoal.get(goalId)||{name:m.goalName||'Silinmiş hedef',addCount:0,addCost:0,withdrawalCount:0,withdrawalValue:0,estimated:0};
    const asset=m.asset||'TRY',qty=Math.max(0,Number(m.quantity)||0);
    if(Number(m.sign)>0){
      const hasCost=asset==='TRY'||Number(m.costRate)>0;
      const unitCost=asset==='TRY'?1:(hasCost?Number(m.costRate):currentPurchaseRate(asset));
      const cost=qty*(Number(unitCost)||0);
      periodCost+=cost;depositCount++;row.addCount++;row.addCost+=cost;
      if(!hasCost){estimatedCostCount++;row.estimated++;}
    }else{
      const val=qty*currentExitRate(asset);

  return `<section class="panel report-savings-panel"><div class="panelhead"><div><h2>Birikim Raporu</h2><p>${esc(periodLabel)} dönem hareketleri ve güncel hedef durumu</p></div></div><div class="report-stat-grid report-savings-stats">${reportStat('Dönem içi alış maliyeti',periodCost,'income','＋')}${reportStat('Çıkarılanların güncel değeri',withdrawalValue,'expense','−')}${reportStat('Güncel toplam birikim',portfolioValue,'net','◉')}${reportStat('Maliyeti bilinen aktif K/Z',tracked.profit,'net','↗')}</div><p class="report-chart-note">Dönem: ${depositCount} ekleme, ${withdrawalCount} çıkarma. ${estimatedCostCount?`${estimatedCostCount} eski hareketin alış maliyeti kaydedilmediğinden güncel satış kuruyla tahmin edildi. `:''}Çıkarılanların değeri bugünkü bozdurma kuru üzerinden hesaplanır. Kâr/zarar yalnızca maliyeti bilinen ve tamamlanmamış döviz/altın birikimlerini kapsar.</p><div class="report-breakdown"><div class="panelhead"><div><h3>Dönem içindeki hareketler</h3></div></div>${movementTable}</div><div class="report-breakdown"><div class="panelhead"><div><h3>Hedeflerin güncel durumu</h3></div></div>${goalTable}</div></section>`;

const RATE_CACHE_KEY='aile-butcem-live-rates-v1';
const XAU_TO_GRAMS=31.1034768;
const COIN_WEIGHTS={CEYREK:1.754,YARIM:3.608,TAM:7.216};

function rateDateLabel(){
  return new Date().toLocaleDateString('tr-TR',{day:'2-digit',month:'long',year:'numeric'});
}
function parseRateNumber(v){
  if(v==null)return 0;
  let s=String(v).trim().replace(/\s/g,'');
  if(s.includes('.')&&s.includes(','))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(s.includes(','))s=s.replace(',','.');
  const n=Number(s);
  return Number.isFinite(n)?n:0;
}
async function fetchJson(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return await r.json();
}
async function fetchText(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return await r.text();
}
function applyCurrencyRates(usdTry,eurTry,source,spread={}){
  const quote=(mid,buyRaw,sellRaw)=>{
    let buy=Number(buyRaw)||0,sell=Number(sellRaw)||0;
    // TCMB alış/satış verisi varsa onu kullan; yalnızca orta kur varsa yaklaşık %0,5 referans makası göster.
    if(!(buy>0&&sell>0)||Math.abs(buy-sell)<0.000001){buy=mid*0.995;sell=mid*1.005;}
    return {buy,sell};
  };
  if(usdTry>0){
    const q=quote(usdTry,spread.usdBuy,spread.usdSell);
    rates.USD=usdTry;rateQuotes.USD={...(rateQuotes.USD||{}),label:'Dolar',value:usdTry,...q,suffix:'TL'};
  }
  if(eurTry>0){
    const q=quote(eurTry,spread.eurBuy,spread.eurSell);
    rates.EUR=eurTry;rateQuotes.EUR={...(rateQuotes.EUR||{}),label:'Euro',value:eurTry,...q,suffix:'TL'};
  }
  if(source)window._fxRateSource=source;
}
function applyGoldSpot(spotUsdOz,usdTry){
  if(!(spotUsdOz>0&&usdTry>0))return false;
  const gold24=spotUsdOz*usdTry/XAU_TO_GRAMS;
  const gold22=gold24*22/24;
  rates.GOLD24=gold24;
  rates.GOLD22=gold22;
  rateQuotes.GOLD24={...(rateQuotes.GOLD24||{}),label:'24 Ayar Altın',buy:gold24*0.99,sell:gold24*1.01,suffix:'TL/gr'};
  rateQuotes.GOLD22={...(rateQuotes.GOLD22||{}),label:'22 Ayar Altın',buy:gold22*0.99,sell:gold22*1.01,suffix:'TL/gr'};
  Object.entries(COIN_WEIGHTS).forEach(([key,weight])=>{
    const value=gold22*weight;
    rates[key]=value;
    const labels={CEYREK:'Çeyrek Altın',YARIM:'Yarım Altın',TAM:'Tam Altın'};
    rateQuotes[key]={...(rateQuotes[key]||{}),label:labels[key],buy:value*0.97,sell:value*1.03,suffix:'TL'};
  });
  window._goldSource='Gold API';
  window._goldSpotUsdOz=spotUsdOz;
  return true;
}
async function fetchTcmbToday(){
  const xml=await fetchText('https://www.tcmb.gov.tr/kurlar/today.xml');
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  if(doc.querySelector('parsererror'))throw new Error('TCMB XML okunamadı');
  const nodes=[...doc.getElementsByTagName('Currency')];
  const get=(code)=>{
    const n=nodes.find(x=>x.getAttribute('CurrencyCode')===code);
    if(!n)return {buy:0,sell:0};
    const sell=parseRateNumber(n.getElementsByTagName('ForexSelling')[0]?.textContent);
    const buy=parseRateNumber(n.getElementsByTagName('ForexBuying')[0]?.textContent);
    return {buy:buy||sell,sell:sell||buy};
  };
  const usd=get('USD'),eur=get('EUR');
  return {usd:usd.sell||usd.buy,eur:eur.sell||eur.buy,usdBuy:usd.buy,usdSell:usd.sell,eurBuy:eur.buy,eurSell:eur.sell};
}
async function fetchOpenCurrencyFallback(){
  const urls=[
    'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',
    'https://latest.currency-api.pages.dev/v1/currencies/usd.json'
  ];
  let last=null;
  for(const url of urls){
    try{
      const data=await fetchJson(url);
      const usd=data?.usd||{};
      const usdTry=parseRateNumber(usd.try);
      const usdEur=parseRateNumber(usd.eur);
      if(usdTry>0&&usdEur>0)return {usd:usdTry,eur:usdTry/usdEur};
    }catch(e){last=e}
  }
  throw last||new Error('Kur fallback başarısız');
}
async function fetchGoldApi(){
  const data=await fetchJson('https://api.gold-api.com/price/XAU');
  const spot=parseRateNumber(data?.price);
  if(!(spot>0))throw new Error('XAU fiyatı alınamadı');
  return {spot,updatedAt:data?.updatedAtReadable||data?.updatedAt||''};
}
function loadRateCache(){
  try{
    const cached=JSON.parse(localStorage.getItem(RATE_CACHE_KEY)||'null');
    if(!cached)return false;
    if(cached.quotes)Object.assign(rateQuotes,cached.quotes);
    if(cached.rates)Object.assign(rates,cached.rates);
    if(cached.updated)rateUpdated=cached.updated;
    return true;
  }catch(e){return false}
}
function saveRateCache(){
  const data={updated:rateUpdated,rates,quotes:rateQuotes,fxSource:window._fxRateSource||'',goldSource:window._goldSource||'',goldSpotUsdOz:window._goldSpotUsdOz||0};
  localStorage.setItem(RATE_CACHE_KEY,JSON.stringify(data));
  S.rateData=data;
}
async function refreshRates(showMessage=false){
  const btn=document.querySelector('.rate-update-btn');
  if(btn){btn.disabled=true;btn.textContent='Güncelleniyor...'}
  let fxOk=false,goldOk=false;
  let fxSource='',goldUpdated='';
  try{
    try{
      const fx=await fetchTcmbToday();
      if(fx.usd>0&&fx.eur>0){applyCurrencyRates(fx.usd,fx.eur,'TCMB',fx);fxOk=true;fxSource='TCMB';}
      else throw new Error('Eksik TCMB kuru');
    }catch(e){
      const fx=await fetchOpenCurrencyFallback();
      applyCurrencyRates(fx.usd,fx.eur,'Currency API (CC0)',{usdBuy:fx.usd,usdSell:fx.usd,eurBuy:fx.eur,eurSell:fx.eur});fxOk=true;fxSource='Currency API (CC0)';
    }
    try{
      const gold=await fetchGoldApi();
      goldOk=applyGoldSpot(gold.spot,rates.USD);
      goldUpdated=gold.updatedAt||'';
    }catch(e){}
    if(fxOk&&goldOk)rateUpdated=rateDateLabel();
    else if(fxOk)rateUpdated=rateDateLabel()+' · Altın verisi bekleniyor';
    saveRateCache();
    save();
  }catch(e){
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Güncelle'}
  }
}
function stopRateAutoRefresh(){
  if(window._rateTimer){
    clearInterval(window._rateTimer);
    window._rateTimer=null;
  }
}
function startRateAutoRefresh(){
  loadRateCache();
  stopRateAutoRefresh();
  if(document.visibilityState==='visible'){
    refreshRates(false);
    window._rateTimer=setInterval(()=>{
      if(document.visibilityState==='visible'){refreshRates(false);if(processDueRecurringTransactions())save();}
    },60*1000);
  }
}
document.addEventListener('visibilitychange',()=>{

    stopRateAutoRefresh();

    window._rateTimer=setInterval(()=>{
      if(document.visibilityState==='visible'){refreshRates(false);if(processDueRecurringTransactions())save();}

    stopRateAutoRefresh();
  }
});

function regularPlanDisplayStatus(startDate, total, generatedCount, endDate){
  const today=date();
  const start=startDate||today;
  const totalMonths=Math.max(1,Number(total)||1);
  const done=Math.max(0,Number(generatedCount)||0);
  const end=endDate||monthlyNextDate(start,Math.max(1,Number(start.slice(-2))||1));
  if(done>=totalMonths && today>=end) return 'Tamamlandı';
  if(today<start) return 'Bekliyor';
  return 'Devam Ediyor';
}

function addRecurringSaving(e){
  e.preventDefault();
  const goalId=byId('rsGoal')?.value,goal=(S.goals||[]).find(g=>String(g.id)===String(goalId));
  const quantity=parseMoney(byId('rsQty')?.value),asset=byId('rsAsset')?.value||'TRY',startDate=byId('rsDate')?.value||date(),months=Math.max(2,Math.min(600,Math.floor(Number(byId('rsMonths')?.value)||12))),memberId=byId('rsMember')?.value||S.active;
  if(!goal||quantity<=0)return;
  let costRate=1;
  if(asset!=='TRY'){costRate=parseRateNumber(byId('rsCost')?.value);if(!(costRate>0)){alert('Döviz veya altın için birim başına alış fiyatını TL olarak gir.');return;}}
  const id=String(uid()),anchorDay=Number(startDate.slice(-2))||1;let d=startDate;
  const plan={id,goalId,goalName:goal.name,asset,quantity,months,remaining:months,generatedCount:months,startDate,nextDate:monthlyNextDate(startDate,anchorDay),memberId,anchorDay,active:true,createdAt:new Date().toISOString()};
  S.savingMovements=S.savingMovements||[];
  for(let i=0;i<months;i++){
    const movementId=`${id}-occ-${i}`;
    S.savingMovements.unshift({id:movementId,goalId,goalName:goal.name,asset,quantity,sign:1,date:d,rate:currentPurchaseRate(asset),costRate:asset==='TRY'?1:costRate,memberId,createdAt:new Date().toISOString(),recurringId:id,recurringOccurrenceId:movementId,scheduledRecurring:true,scheduleMonthIndex:i+1,scheduleTotalMonths:months});
    goal.holdings[asset]=Math.max(0,(Number(goal.holdings[asset])||0)+quantity);
    d=monthlyNextDate(d,anchorDay);
  }
  S.recurringSavings=S.recurringSavings||[];S.recurringSavings.unshift(plan);closeModal();save();
}

function addTx(e){
  e.preventDefault();
  const amount=parseMoney(byId('txAmount')?.value);
  if(amount<=0)return;
  const type=byId('txType')?.value||'gider';
  const category=byId('txCat')?.value||'Diğer';
  const startDate=byId('txDate')?.value||date();
  const description=(byId('txDesc')?.value||'').trim()||category;
  const asset=byId('txAsset')?.value||'TRY';
  const memberId=byId('txMember')?.value||S.active;
  if(byId('txRecurring')?.value==='1'){

function monthlyNextDate(iso,anchorDay){
  const parts=String(iso||date()).split('-').map(Number);
  const next=new Date(parts[0],parts[1],1,12);
  const lastDay=new Date(next.getFullYear(),next.getMonth()+1,0).getDate();
  next.setDate(Math.min(Number(anchorDay)||parts[2]||1,lastDay));
  return `${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}-${String(next.getDate()).padStart(2,'0')}`;
}
// Eski sürümlerde tek satır olarak saklanan düzenli planları, her aya ait bağımsız taksitlere dönüştür.
// Deterministik kimlikler kullanılır; aile üyeleri aynı planı eş zamanlı görürse mükerrer satırlar oluşmaz.
function expandLegacyRecurringPayments(){
  const source=Array.isArray(S.payments)?S.payments:[];
  const expanded=[];
  let changed=false;
  source.forEach(p=>{
    if(!p.recurring||p.recurringGroupId||p.installment){expanded.push(p);return;}
    const total=Math.max(1,Math.floor(Number(p.months)||1));
    const remaining=Math.max(0,Math.min(total,Math.floor(Number(p.remaining??total)||0)));
    const relatedTx=(S.transactions||[]).filter(t=>String(t.paymentId||'')===String(p.id)).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
    const base={...p,recurring:true,recurringGroupId:String(p.id),installment:true,recurringTotal:total,months:total};
    if(p.status==='bekliyor'&&remaining>0){
      const firstIndex=Math.max(1,total-remaining+1);
      const historical=relatedTx.slice(0,Math.max(0,firstIndex-1));
      const historicalStart=Math.max(1,firstIndex-historical.length);
      historical.forEach((tx,i)=>{
        const index=historicalStart+i;
        expanded.push({...base,id:`${p.id}-installment-${index}`,dueDate:tx.date||p.lastPaidDate||p.dueDate,status:'odendi',recurringIndex:index,remaining:Math.max(0,total-index),transactionId:tx.id,lastPaidDate:tx.date||null});
      });
      const anchor=Number(p.anchorDay)||Number(String(p.startDate||p.dueDate||date()).slice(-2))||1;
      let cursor=p.dueDate||date();
      for(let i=0;i<remaining;i++){
        const index=firstIndex+i;
        expanded.push({...base,id:`${p.id}-installment-${index}`,dueDate:cursor,status:'bekliyor',recurringIndex:index,remaining:Math.max(0,total-index),transactionId:null,lastPaidDate:null});
        cursor=monthlyNextDate(cursor,anchor);
      }
      changed=true;
    }else if(p.status==='odendi'){
      const paidTxs=relatedTx.slice(-total);
      if(paidTxs.length){
        const firstIndex=Math.max(1,total-paidTxs.length+1);
        paidTxs.forEach((tx,i)=>{
          const index=firstIndex+i;
          expanded.push({...base,id:`${p.id}-installment-${index}`,dueDate:tx.date||p.lastPaidDate||p.dueDate,status:'odendi',recurringIndex:index,remaining:Math.max(0,total-index),transactionId:tx.id,lastPaidDate:tx.date||null});
        });
      }else{
        expanded.push({...base,id:`${p.id}-installment-${total}`,dueDate:p.lastPaidDate||p.dueDate,status:'odendi',recurringIndex:total,remaining:0,transactionId:p.transactionId||null});
      }
      changed=true;
    }else{
      expanded.push(p);
    }
  });
  if(changed)S.payments=expanded;
  return changed;
}

function safeAddCalendarMonths(iso, n){
  const [year, month, day] = String(iso).split('-').map(Number);
  const first = new Date(year, month - 1 + n, 1, 12);
  const lastDay = new Date(first.getFullYear(), first.getMonth() + 1, 0, 12).getDate();
  const y = first.getFullYear(), m = String(first.getMonth() + 1).padStart(2, '0'), d = String(Math.min(day, lastDay)).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function loanDurationText(l){
  if(!l.closedAt || !l.date) return '';
  const durationStart = l.createdAt || l.date;
  const start = new Date(durationStart + 'T12:00:00'), end = new Date(l.closedAt + 'T12:00:00');
  if(Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || end < start) return '';
  const totalDays = Math.round((end - start) / 86400000);
  if(totalDays === 0) return 'Kapatılma süresi: Aynı gün';
  let months = 0;
  while(months < 1200 && safeAddCalendarMonths(durationStart, months + 1) <= l.closedAt) months++;
  if(months === 0) return `Kapatılma süresi: ${totalDays} gün`;
  const anchor = new Date(safeAddCalendarMonths(durationStart, months) + 'T12:00:00');
  const extraDays = Math.max(0, Math.round((end - anchor) / 86400000));
  return `Kapatılma süresi: ${months} ay${extraDays ? ` ${extraDays} gün` : ''} (${totalDays} gün)`;
}
function normalizeLoanRecord(l){
  const loan={...l,asset:l.asset||'TRY',status:l.status||'open',memberId:l.memberId||S.active,date:l.date||String(l.createdAt||date()).slice(0,10),closedAt:l.closedAt||null};
  const original=Math.max(0,Number(loan.amount)||0);
  let settlements=Array.isArray(loan.settlements)?loan.settlements.filter(x=>x&&Number(x.amount)>0).map(x=>({...x,id:String(x.id||uid()),amount:Math.max(0,Number(x.amount)||0),date:x.date||loan.closedAt||loan.date||date(),memberId:x.memberId||loan.memberId||S.active})):[];
  // Migrate previous versions that stored a single settlement in closedAmount.
  if(!settlements.length){
    const legacy=loan.closedAmount!=null?Math.max(0,Number(loan.closedAmount)||0):(loan.status==='closed'?original:0);
    if(legacy>0){
      settlements=[{id:`legacy-${String(loan.id)}`,amount:Math.min(original,legacy),date:loan.closedAt||loan.date||date(),memberId:loan.memberId||S.active,legacy:true}];
    }
  }
  loan.settlements=settlements;
  const paid=settlements.reduce((sum,x)=>sum+(Number(x.amount)||0),0);
  loan.closedAmount=paid;
  const remaining=Math.max(0,original-paid);
  loan.status=original>0&&remaining<=LOAN_AMOUNT_EPSILON?'closed':'open';
  loan.closedAt=loan.status==='closed'?(loan.closedAt||settlements[settlements.length-1]?.date||loan.date):null;
  return loan;
}
function loanSettledAmount(l){

function loanRemainingAmount(l){return Math.max(0,(Number(l?.amount)||0)-loanSettledAmount(l));}

function confirmLoanClose(e,id){

  const remaining=loanRemainingAmount(loan);

  }

function deleteLoanSettlement(loanId,settlementId){

function savingMovementTable(rows,lotState,isAddition,completed){
  if(!rows.length)return `<div class="detail-empty-note">${isAddition?'Bu hedefe henüz birikim eklenmemiş.':'Bu hedeften henüz birikim çıkarılmamış.'}</div>`;
  const selectionHead=deleteMode.movements?'<th class="movement-select-col">Seç</th>':'';
  const headers=isAddition?'<th>Tarih</th><th>İşlemi yapan</th><th>Miktar</th><th>Alış maliyeti</th><th>Güncel değer</th><th>Kâr / Zarar</th>':'<th>Tarih</th><th>İşlemi yapan</th><th>Miktar</th><th>Güncel değer</th>';
  const body=rows.map(x=>{
    const asset=x.asset||'TRY',assetName=assetLabels[asset]||asset,qty=Math.max(0,Number(x.quantity)||0);
    const current=qty*(asset==='TRY'?1:currentExitRate(asset));
    const select=deleteMode.movements?`<td class="movement-select-col"><input type="checkbox" ${deleteSelected.movements.has(x.id)||deleteSelected.movements.has(String(x.id))?'checked':''} onchange="toggleDeleteSelection('movements','${String(x.id).replace(/'/g,"\\'")}')" aria-label="Bu hareketi silmek için seç"></td>`:'';
    let extras='';
    if(isAddition){
      const lot=lotState.byMovementId.get(String(x.id));
      const remain=Math.max(0,Number(lot?.remaining)||0);
      const hasCost=asset==='TRY'||(Number(x.costRate)>0&&!!lot);
      const cost=asset==='TRY'?remain:(hasCost?remain*Number(x.costRate):0);
      const currentRemain=remain*(asset==='TRY'?1:currentExitRate(asset));
      const profit=currentRemain-cost,pct=cost>0?profit/cost*100:0;
      const profitText=completed?'Hedef tamamlandı':asset==='TRY'?'—':!hasCost?'Maliyet eksik':remain<=0?'Kalan miktar yok':`${signedMoney(profit)} (${signedPercent(pct)})`;
      const profitClass=completed||asset==='TRY'?'pl-neutral':!hasCost||remain<=0?'pl-unknown':profit>=0?'pl-positive':'pl-negative';
      extras=`<td>${hasCost?fmt(cost):'Kayıtlı değil'} TL</td><td>${fmt(currentRemain)} TL</td><td class="${profitClass}">${profitText}</td>`;
    }else extras=`<td>${fmt(current)} TL</td>`;
    return `<tr class="${isAddition?'movement-row-added':'movement-row-removed'}">${select}<td>${fd(x.date)}</td><td>${esc(member(x.memberId))}</td><td class="movement-quantity"><span class="${isAddition?'pl-positive':'pl-negative'}">${isAddition?'+':'−'}${fnum(qty)} ${esc(assetName)}</span></td>${extras}</tr>`;
  }).join('');
  return `<div class="movement-table-wrap"><table class="movement-history-table"><thead><tr>${selectionHead}${headers}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function movementNetByAsset(goalId,movements=(S.savingMovements||[])){
  const net={};
  movements.filter(m=>String(m.goalId)===String(goalId)).forEach(m=>{
    const asset=m.asset||'TRY';net[asset]=(Number(net[asset])||0)+(Number(m.quantity)||0)*(Number(m.sign)||1);
  });
  return net;
}
function holdingsBaseline(g,movements=(S.savingMovements||[])){
  const net=movementNetByAsset(g.id,movements),baseline={};
  for(const asset of new Set([...Object.keys(g.holdings||{}),...Object.keys(net)])){
    const current=Math.max(0,Number(g.holdings?.[asset])||0),movementNet=Number(net[asset])||0;
    baseline[asset]=current<=1e-8&&movementNet<0?0:Math.max(0,current-movementNet);
  }
  return baseline;
}
function rebuildGoalHoldings(g,baseline={}){
  if(!g)return;
  const net=movementNetByAsset(g.id),next={};
  for(const asset of new Set([...Object.keys(baseline||{}),...Object.keys(net)])){
    const qty=Math.max(0,(Number(baseline?.[asset])||0)+(Number(net[asset])||0));
    if(qty>1e-8)next[asset]=qty;
  }
  g.holdings=next;
}
function reconcileGoalAfterMovementDeletion(g, deletedIds){
  if(!g)return;
  g.holdings=g.holdings||{};
  // Remove zero-quantity asset chips so a deleted movement no longer leaves an icon under its goal.
  for(const [asset,rawQty] of Object.entries(g.holdings)){
    const qty=Number(rawQty)||0;
    if(qty<=1e-8)delete g.holdings[asset];
  }
  const target=Number(g.target)||0;
  const currentValue=goalValueInTarget(g);
  const remaining=(S.savingMovements||[]).filter(m=>String(m.goalId)===String(g.id));
  if(currentValue+1e-8<target){
    g.completionDate=null;g.completionMemberId=null;g.completionMovementId=null;
    return;
  }
  const completionMoveStillExists=!!g.completionMovementId&&remaining.some(m=>String(m.id)===String(g.completionMovementId));
  const completionMoveWasDeleted=!!g.completionMovementId&&deletedIds?.has(String(g.completionMovementId));
  if(g.completionDate&&completionMoveStillExists&&!completionMoveWasDeleted)return;
  // The deleted movement may have marked completion. Replay surviving history to find the point
  // at which the target was reached, using the same current valuation basis as goalValueInTarget.
  const timeline=remaining.slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
  const replay={};let crossed=null;
  const targetRate=currentPurchaseRate(g.targetAsset||'TRY')||1;
  for(const m of timeline){
    const asset=m.asset||'TRY';
    const delta=(Number(m.quantity)||0)*(Number(m.sign)||1);
    replay[asset]=Math.max(0,(Number(replay[asset])||0)+delta);
    const value=Object.entries(replay).reduce((sum,[a,q])=>sum+Math.max(0,Number(q)||0)*currentExitRate(a),0)/targetRate;
    if(value+1e-8>=target){crossed=m;break;}
  }
  if(crossed){
    g.completionDate=crossed.date||date();
    g.completionMemberId=crossed.memberId||g.memberId||S.active||null;
    g.completionMovementId=crossed.id;
  }else if(timeline.length){
    const fallback=timeline[timeline.length-1];
    g.completionDate=fallback.date||date();
    g.completionMemberId=fallback.memberId||g.memberId||S.active||null;
    g.completionMovementId=fallback.id;
  }else{
    // Preserve any legacy holding that has no movement history, but remove stale completion metadata.
    g.completionDate=null;g.completionMemberId=null;g.completionMovementId=null;
  }
}
function deleteSavingMovement(id){const x=(S.savingMovements||[]).find(m=>String(m.id)===String(id));if(!x)return;const deletedIds=new Set([String(x.id)]);const g=S.goals.find(g=>String(g.id)===String(x.goalId));const baseline=g?holdingsBaseline(g):{};S.savingMovements=(S.savingMovements||[]).filter(m=>String(m.id)!==String(id));if(g){rebuildGoalHoldings(g,baseline);reconcileGoalAfterMovementDeletion(g,deletedIds)}save()}

function goalCompletionDetails(g){
  const completion=findGoalCompletionDate(g);
  const movements=(S.savingMovements||[]).filter(m=>String(m.goalId)===String(g.id));
  const completingMove=(g.completionMovementId?movements.find(m=>String(m.id)===String(g.completionMovementId)):null)||movements.filter(m=>Number(m.sign)>0&&(!completion||String(m.date||'')<=String(completion))).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(b.createdAt||'').localeCompare(String(a.createdAt||'')))[0];
  const completedBy=g.completionMemberId?esc(member(g.completionMemberId)):'Önceki kayıtta tamamlayan bilgisi tutulmamış';
  const lotState=acquisitionLotState();
  const held=Object.entries(g.holdings||{}).filter(([,q])=>Number(q)>0);
  let totalCost=0,costComplete=true;
  const assetRows=held.map(([asset,quantity])=>{
    const lots=lotState.lotsByKey.get(`${g.id}::${asset}`)||[];
    const remainingLots=lots.filter(l=>l.remaining>0);
    const knownLots=remainingLots.filter(l=>Number(l.costRate)>0);
    const unknownQty=remainingLots.filter(l=>!(Number(l.costRate)>0)).reduce((sum,l)=>sum+l.remaining,0);
    const knownQty=knownLots.reduce((sum,l)=>sum+l.remaining,0);
    const knownCost=knownLots.reduce((sum,l)=>sum+l.remaining*l.costRate,0);
    const trackedQty=remainingLots.reduce((sum,l)=>sum+l.remaining,0);
    const fullCostKnown=unknownQty<1e-7&&Math.abs(trackedQty-Number(quantity))<1e-5;
    if(!fullCostKnown)costComplete=false;
    totalCost+=knownCost;
    const currentRate=currentExitRate(asset),currentValue=Number(quantity)*currentRate;
    const averageCost=knownQty>0?knownCost/knownQty:0;
    return `<div class="goal-completion-asset"><b>${esc(assetLabels[asset]||asset)} · ${fnum(quantity)}</b><span>${knownQty>0?`Alış: ${fmt(averageCost)} / birim`:'Alış maliyeti: kayıtlı değil'}</span><span>Güncel fiyat: ${fmt(currentRate)} / birim</span><span>Güncel değer: ${fmt(currentValue)}</span></div>`;
  }).join('');
  return `<section class="goal-completion-details"><div class="goal-completion-meta"><div><small>Tamamlanma tarihi</small><b>${completion?fd(completion):'Tarih bilgisi bulunamadı'}</b></div><div><small>Tamamlayan</small><b>${completedBy}</b></div><div><small>${costComplete?'Toplam alış maliyeti':'Bilinen alış maliyeti'}</small><b>${fmt(totalCost)}</b></div><div><small>Güncel toplam değer</small><b>${fmt(holdingsValue(g.holdings))}</b></div></div>${assetRows?`<div class="goal-completion-assets">${assetRows}</div>`:''}<div class="goal-completed-note">Bu hedef tamamlandı; tamamlanan hedefler için kâr/zarar hesabı gösterilmiyor.</div>${!costComplete?'<div class="goal-cost-warning">Bazı eski hareketlerde gerçek alış fiyatı tutulmadığından alış maliyeti toplamı eksik olabilir.</div>':''}</section>`;
}
function goalFinancialSnapshot(g,lotState=acquisitionLotState()){
  let knownCost=0,costKnown=true;
  const holdings=g.holdings||{};
  for(const [asset,rawQty] of Object.entries(holdings)){
    const qty=Math.max(0,Number(rawQty)||0);if(qty<=1e-8)continue;
    if(asset==='TRY'){knownCost+=qty;continue;}
    const lots=(lotState.lotsByKey.get(`${g.id}::${asset}`)||[]).filter(l=>Number(l.remaining)>1e-8);
    const trackedQty=lots.reduce((sum,l)=>sum+Number(l.remaining||0),0);
    if(Math.abs(trackedQty-qty)>1e-5)costKnown=false;
    for(const lot of lots){
      if(Number(lot.costRate)>0)knownCost+=Number(lot.remaining)*Number(lot.costRate);
      else costKnown=false;
    }
  }
  const value=holdingsValue(holdings),completed=goalIsCompleted(g);
  const completion=findGoalCompletionDate(g);
  return {knownCost,costKnown,value,completed,profit:costKnown?value-knownCost:null,percent:costKnown&&knownCost>0?(value-knownCost)/knownCost*100:0,date:completed?(completion||g.completionDate||g.startDate||''):(g.startDate||'')};
}
function goalFinancialLines(g,compact=false){
  const snap=goalFinancialSnapshot(g);

  const plText=snap.completed?'Hedef tamamlandı':snap.costKnown?`${signedMoney(snap.profit)} (${signedPercent(snap.percent)})`:'Maliyet eksik';

function adjust(id,sign){
  let g=S.goals.find(x=>String(x.id)===String(id)),assetEl=byId('asset-'+id),amtEl=byId('amt-'+id),dateEl=byId('saveDate-'+id),costEl=byId('costRate-'+id),a=assetEl?.value,v=Number(amtEl?.value)||0,saveDate=dateEl?.value||date();

  }
  let beforeTotal=goalValueInTarget(g),qty=sign>0?v:-v;

  S.savingMovements.unshift(movement);

function handleRemoteFamilyState(payload){
  const incoming=payload?.new?.state;
  if(!incoming||typeof incoming!=='object')return;
  const incomingJson=stableStringify(incoming);
  if(incomingJson===cloud.lastCloudJson||incomingJson===cloud.pendingWriteJson)return;
  const wasReady=cloud.syncReady;
  if(wasReady){notifyFamilyChange(payload?.new?.updated_by,incoming)}
  if(!cloud.syncReady){
    if(!Object.keys(incoming).length)return;
    rememberLocalBackup();
    const migratedPayments=applySharedState(incoming,cloud.member?.profile_id);
    cloud.lastCloudJson=incomingJson;cloud.syncReady=true;
    rememberVerifiedCloudCache();
    setCloudMessage('Aile verileri hazır. Ortak kayıtlar yüklendi.','success');
    render();if(migratedPayments)scheduleCloudSync();return;
  }
  if(cloud.localPending||cloud.writeInFlight||cloud.saveTimer||document.getElementById('modal')?.classList.contains('show')){
    cloud.pendingRemoteState=incoming;
    setCloudMessage('Başka bir cihazda değişiklik yapıldı. Formu tamamladıktan sonra güncel veriler eşitlenecek.');
    return;
  }
  const migratedPayments=applySharedState(incoming);
  cloud.lastCloudJson=incomingJson;
  rememberVerifiedCloudCache();
  setCloudMessage('Aile verileri eşitlendi.','success');
  render();if(migratedPayments)scheduleCloudSync();
}

    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'family_state',filter:'family_id=eq.'+fid},handleRemoteFamilyState)

      if(payload?.new?.name){cloud.family.name=payload.new.name;S.family={id:fid,name:payload.new.name,inviteToken:''};persistLocalOnly();render();}
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'family_members',filter:'family_id=eq.'+fid},()=>{refreshCloudRoster().then(render)})
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'family_members',filter:'family_id=eq.'+fid},()=>{refreshCloudRoster().then(render)})
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'family_members',filter:'family_id=eq.'+fid},()=>{refreshCloudRoster().then(render)})

function generateInviteCode(){
  const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // Belirsiz I/O/1/0 karakterleri yok.
  const bytes=new Uint8Array(8);
  if(typeof crypto!=='undefined'&&crypto.getRandomValues)crypto.getRandomValues(bytes);
  else for(let i=0;i<bytes.length;i++)bytes[i]=Math.floor(Math.random()*256);
  return Array.from(bytes,b=>alphabet[b%alphabet.length]).join('');
}

function extractInviteToken(value){

  return /^[A-Za-z0-9]{8}$/.test(raw)?raw.toUpperCase():raw;
}

  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(raw))return {token:raw,familyName:''};
  return {token:'',familyName:''};
}

  cloud.member={family_id:data.family_id,user_id:cloud.user.id,profile_id:profileId,display_name:displayName,role:'member'};
  const {data:familyData,error:familyError}=await sb.from('families').select('id,name,owner_id,created_at').eq('id',data.family_id).single();
  if(familyError){cloud.busy=false;cloud.syncReady=false;setCloudMessage('Aile üyeliği oluştu ancak aile bilgisi alınamadı: '+cloudErrorText(familyError),'error');render();return false;}
  cloud.family=familyData;
  const {data:stateRow,error:stateError}=await sb.from('family_state').select('state,updated_at').eq('family_id',data.family_id).maybeSingle();
  if(stateError){cloud.busy=false;cloud.syncReady=false;await refreshCloudRoster();setupCloudRealtime();setCloudMessage('Aile üyeliği oluştu ancak ortak veriler alınamadı: '+cloudErrorText(stateError),'error');render();return false;}
  if(!stateRow?.state||!Object.keys(stateRow.state).length){
    cloud.busy=false;cloud.syncReady=false;await refreshCloudRoster();setupCloudRealtime();
    setCloudMessage('Aileye katıldın. Kurucu ortak verileri başlatınca aile kayıtları otomatik yüklenecek.','');render();return true;
  }
  rememberLocalBackup();cloud.syncReady=false;
  const remoteStateJson=stableStringify(stateRow.state);applySharedState(stateRow.state,profileId);
  if(!S.members.some(m=>m.id===profileId))S.members.push({id:profileId,name:displayName});
  S.active=profileId;S.family={id:familyData.id,name:familyData.name,inviteToken:''};
  persistLocalOnly();cloud.lastCloudJson=remoteStateJson;cloud.syncReady=true;cloud.busy=false;rememberVerifiedCloudCache();
  refreshCloudRoster().then(()=>{if(tab==='aile')render()}).catch(e=>console.warn('Aile listesi yenilenemedi',e));setupCloudRealtime();setCloudMessage('Aileye katıldın. Kurucunun ortak verileri yüklendi.','success');
  save();return true;
}

async function createCloudInvite(){
  if(!sb||!cloud.user||!cloud.family||!cloud.member||!cloud.syncReady)return;
  cloud.busy=true;setCloudMessage('Kısa davet kodu oluşturuluyor…');render();
  const expiresAt=new Date(Date.now()+7*24*60*60*1000).toISOString();
  let token='',error=null;
  // 8 karakterli kodda çok düşük olasılıklı benzersiz değer çakışması olursa yeniden dene.
  for(let attempt=0;attempt<3;attempt++){
    token=generateInviteCode();
    const result=await sb.from('family_invites').insert({family_id:cloud.family.id,token,created_by:cloud.user.id,expires_at:expiresAt});
    error=result.error||null;
    if(!error)break;
    if(!/duplicate key|unique/i.test(String(error.message||'')))break;
  }
  cloud.busy=false;
  if(error){setCloudMessage('Davet oluşturulamadı: '+cloudErrorText(error),'error');render();return}
  cloud.inviteToken=token;cloud.inviteUrl=buildInviteUrl(token);
  setCloudMessage('8 karakterli davet kodu oluşturuldu. Kod 7 gün geçerli ve bir kez kullanılabilir.','success');render();
}

async function saveVisibleName(e){

  const name=(byId('visibleNameInput')?.value||'').trim().replace(/\s+/g,' ');
  if(!name){setCloudMessage('Aile içinde görünecek adını yaz.','error');render();return}
  if(name.length>80){setCloudMessage('Görünür ad en fazla 80 karakter olabilir.','error');render();return}
  cloud.busy=true;setCloudMessage('Görünür ad güncelleniyor…');render();
  try{
    if(cloud.member){const {error}=await sb.rpc('update_my_family_display_name',{p_display_name:name});if(error)throw error}
    const {data,error:authError}=await sb.auth.updateUser({data:{display_name:name}});
    if(authError&&!cloud.member)throw authError;
    if(data?.user)cloud.user=data.user;else if(cloud.user)cloud.user={...cloud.user,user_metadata:{...(cloud.user.user_metadata||{}),display_name:name}};
    if(cloud.member)cloud.member={...cloud.member,display_name:name};
    const profileId=cloud.member?.profile_id;
    if(profileId){const own=S.members.find(m=>m.id===profileId);if(own)own.name=name;else S.members.push({id:profileId,name})}
    else{const active=S.members.find(m=>m.id===S.active);if(active)active.name=name}
    cloud.roster=(cloud.roster||[]).map(m=>m.user_id===cloud.user.id?{...m,display_name:name}:m);
    cloud.busy=false;setCloudMessage('Aile içinde görünen adın güncellendi.','success');save();
  }catch(error){cloud.busy=false;setCloudMessage('Ad güncellenemedi: '+cloudErrorText(error)+(cloud.member?' — Aile üyelerinin adını değiştirme SQL güncellemesi henüz çalıştırılmamış olabilir.':''),'error');render()}

function toggleDeleteSelection(type,id){
  if(type==='loans'){

    else{
      deleteSelected.loans.add(loanId);

function confirmDelete(type){
  let ids=deleteSelected[type];
  if(type==='transactions'){
    S.transactions=S.transactions.filter(x=>!ids.has(x.id));
  }else if(type==='recurringTransactions'){
    S.recurringTransactions=(S.recurringTransactions||[]).filter(x=>!ids.has(x.id));
  }else if(type==='payments'){
    const selectedPayments=S.payments.filter(p=>ids.has(p.id));
    const relatedPaymentIds=new Set(ids);
    const selectedGroups=new Set(selectedPayments.map(p=>p.recurringGroupId).filter(Boolean));
    selectedGroups.forEach(groupId=>{
      const unselectedSibling=S.payments.some(p=>String(p.recurringGroupId||'')===String(groupId)&&!ids.has(p.id));
      if(!unselectedSibling)relatedPaymentIds.add(groupId);
    });
    S.transactions=S.transactions.filter(t=>!relatedPaymentIds.has(t.paymentId));
    S.payments=S.payments.filter(x=>!ids.has(x.id));
  }else if(type==='recurringPayments'){
    const groups=new Set(Array.from(ids).map(String));
    const paymentIds=new Set((S.payments||[]).filter(p=>groups.has(String(p.recurringGroupId||p.id))).map(p=>String(p.id)));
    S.transactions=S.transactions.filter(t=>!paymentIds.has(String(t.paymentId||'')));
    S.payments=S.payments.filter(p=>!paymentIds.has(String(p.id)));
  }else if(type==='goals'){
    S.goals=S.goals.filter(x=>!ids.has(x.id));
    S.savingMovements=(S.savingMovements||[]).filter(x=>!ids.has(x.goalId));
  }else if(type==='movements'){
    const selectedMoves=(S.savingMovements||[]).filter(x=>ids.has(x.id)||ids.has(String(x.id)));
    const affectedGoalIds=new Set(selectedMoves.map(x=>String(x.goalId)));
    const deletedMoveIds=new Set(selectedMoves.map(x=>String(x.id)));
    const baselines=new Map();
    affectedGoalIds.forEach(goalId=>{const g=S.goals.find(g=>String(g.id)===goalId);if(g)baselines.set(goalId,holdingsBaseline(g));});
    S.savingMovements=(S.savingMovements||[]).filter(x=>!(ids.has(x.id)||ids.has(String(x.id))));
    affectedGoalIds.forEach(goalId=>{
      const g=S.goals.find(g=>String(g.id)===goalId);
      if(g){rebuildGoalHoldings(g,baselines.get(goalId)||{});reconcileGoalAfterMovementDeletion(g,deletedMoveIds)}
    });
  }else if(type==='loans'){
    const selectedLoanIds=new Set(Array.from(ids).map(String));
    S.loans=(S.loans||[]).filter(x=>!selectedLoanIds.has(String(x.id)));
    const paymentDeletes=new Map();
    for(const key of (deleteSelected.loanSettlements||new Set())){
      const split=String(key).split('::');
      if(split.length<2)continue;
      const loanId=split.shift(),settlementId=split.join('::');
      if(!paymentDeletes.has(loanId))paymentDeletes.set(loanId,new Set());
      paymentDeletes.get(loanId).add(settlementId);
    }
    paymentDeletes.forEach((settlementIds,loanId)=>{
      const loan=(S.loans||[]).find(x=>String(x.id)===String(loanId));
      if(!loan)return;
      loan.settlements=(Array.isArray(loan.settlements)?loan.settlements:[]).filter(x=>!settlementIds.has(String(x.id)));
      const settled=loan.settlements.reduce((sum,x)=>sum+Math.max(0,Number(x.amount)||0),0);
      const original=Math.max(0,Number(loan.amount)||0);
      const remaining=Math.max(0,original-settled);
      loan.closedAmount=settled;
      loan.status=original>0&&remaining<=LOAN_AMOUNT_EPSILON?'closed':'open';
      if(loan.status==='closed'){
        const dates=loan.settlements.map(x=>x.date).filter(Boolean).sort();
        loan.closedAt=dates.length?dates[dates.length-1]:(loan.date||null);
      }else loan.closedAt=null;
    });
  }
  closeModal();
  deleteMode[type]=false;
  deleteSelected[type]=new Set();
  if(type==='loans')deleteSelected.loanSettlements=new Set();
  save();
}

function closeModal(){document.getElementById('modal').classList.remove('show');setTimeout(applyPendingRemoteIfSafe,250)}
function applyPendingRemoteIfSafe(){if(!cloud.pendingRemoteState||cloud.localPending||cloud.writeInFlight||cloud.saveTimer||document.getElementById('modal')?.classList.contains('show'))return;const incoming=cloud.pendingRemoteState;cloud.pendingRemoteState=null;const json=stableStringify(incoming);if(json!==cloud.lastCloudJson){const migratedPayments=applySharedState(incoming);cloud.lastCloudJson=json;setCloudMessage('Aile verileri eşitlendi.','success');render();if(migratedPayments)scheduleCloudSync()}}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
bootstrapVerifiedCachedView();
if(processDueRecurringTransactions())save();else render();
try{updateTxSubmitLabel();}catch(e){}

document.addEventListener('change',function(e){
  const t=e.target;
  if(t && (t.name==='txType' || t.id==='txType')) updateTxSubmitLabel();
});

try{startRateAutoRefresh();}catch(e){}
initCloud().catch(e=>{console.error('Supabase başlatma hatası',e);cloud.initialized=true;cloud.loading=false;setCloudMessage(cloudErrorText(e),'error');render()});
</script>
